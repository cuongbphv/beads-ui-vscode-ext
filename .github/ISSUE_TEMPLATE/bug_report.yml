name: Bug report
description: Something in the dashboard shows the wrong thing, or fails
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Almost every failure here is a `bd` call that did not return what the UI expected.
        **`Beads: Show bd Output Log`** records every argv and every failure — that log is
        usually the whole answer, so please include the relevant lines.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Beads icon in the Activity Bar
        2. Board tab, drag `abc-1` from In progress to Done
        3. The card snaps back and no toast appears
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: bd Output Log
      description: "Command Palette → `Beads: Show bd Output Log`. Paste the lines around the failure."
      render: text
    validations:
      required: false
  - type: input
    id: bd-version
    attributes:
      label: bd version
      description: Output of `bd --version`.
      placeholder: bd 1.2.2
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: 0.1.4
    validations:
      required: true
  - type: input
    id: editor
    attributes:
      label: Editor and OS
      placeholder: VS Code 1.105.0 / macOS 15.2 — or Cursor 0.44 / Windows 11
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: The same `bd` command run in a terminal in that workspace behaves differently from the UI (if it behaves the same, this is likely a `bd` bug — file it upstream)
          required: false
        - label: I searched the open issues
          required: true
